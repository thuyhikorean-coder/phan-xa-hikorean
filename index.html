<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Nunito Sans',system-ui,sans-serif;background:#FBF7EC;color:#34332C;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
.saek{position:fixed;top:0;left:0;right:0;height:8px;background:linear-gradient(90deg,#2A0947 0 25%,#FBB902 25% 50%,#AD4813 50% 75%,#503308 75%)}
.card{width:100%;max-width:400px;background:#fff;border:2px solid #2A0947;border-radius:20px;padding:32px 26px 26px;text-align:center;box-shadow:6px 6px 0 #FBB902}
.logo{width:76px;height:auto;margin:0 auto 10px;display:block}
.ko{font-family:'Noto Serif KR',serif;font-weight:900;font-size:26px;color:#2A0947;margin:6px 0 2px}
h1{font-size:17px;margin:0 0 4px;color:#2A0947}
p{margin:0 0 18px;font-size:14px;color:#503308;line-height:1.5}
input{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:2px solid #503308;border-radius:12px;background:#FBF7EC;color:#34332C;text-align:center;outline:none}
input:focus{border-color:#2A0947;box-shadow:0 0 0 3px #FFDE59}

async function open(pw){

  var base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);

}

async function run(p,auto){
